# Copy to .github/workflows/prereview.yml
#
# PRIVILEGED job: comments, labels, statuses, optional fix commits. It NEVER runs PR code:
# lint results come from the prereview-analyze workflow's artifact and are treated as
# untrusted data. Always runs the workflow file from the default branch.
name: prereview

on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited]
  issue_comment:
    types: [created]
  # Re-review when CI or the analysis job finishes (results changed on the same commit).
  workflow_run:
    workflows: ["CI", "prereview-analyze"]
    types: [completed]
  # Catch-up sweep: re-checks open PRs and retries pending reviews.
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
    inputs:
      pr:
        description: PR number to review (empty = bounded catch-up sweep)
        required: false
      limit:
        description: Max PRs to sweep (default 20)
        required: false
      fresh_model:
        description: Request a fresh model review for the specified PR
        type: boolean
        default: false

permissions:
  contents: read
  pull-requests: write
  issues: write
  statuses: write
  checks: read
  actions: read

jobs:
  prereview:
    if: >-
      (github.event_name != 'workflow_dispatch' || github.ref_name == github.event.repository.default_branch) &&
      (github.event_name != 'issue_comment' ||
        (github.event.issue.pull_request && github.event.comment.user.type != 'Bot' &&
          (contains(github.event.comment.body, '/bot ') ||
           contains(github.event.comment.body, format('/bot{0}', fromJSON('"\t"'))))))
    # All review triggers share one writer, including sweeps and completion events from forks.
    concurrency:
      group: prbot-review-writes
      queue: max
    runs-on: ${{ vars.ORBIT_REVIEW_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      # Base branch only. Used to commit fixes (git apply + push); no PR code is executed.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          fetch-depth: 1
      - uses: ./.github/actions/prbot
        with:
          review-identity: ${{ vars.ORBIT_REVIEW_IDENTITY }}
          user-review-token: ${{ vars.ORBIT_REVIEW_IDENTITY == 'user' && secrets.ORBIT_USER_REVIEW_TOKEN || '' }}
          push-token: ${{ secrets.ORBIT_PUSH_TOKEN || secrets.PRBOT_PUSH_TOKEN }}
          # bot-login: my-app[bot]   # set this when github-token is a GitHub App token
          setup-python: ${{ runner.environment != 'self-hosted' }}
          llm-base-url: ${{ secrets.ORBIT_LLM_BASE_URL || secrets.PRBOT_LLM_BASE_URL }}
          llm-api-key: ${{ secrets.ORBIT_LLM_API_KEY || secrets.PRBOT_LLM_API_KEY }}
          anthropic-api-key: ${{ secrets.ORBIT_ANTHROPIC_API_KEY || secrets.PRBOT_ANTHROPIC_API_KEY }}
