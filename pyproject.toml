[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prbot"
version = "0.1.0"
description = "Orbit reviews GitHub pull requests, comments on findings, and can apply supported lint fixes."
readme = "README.md"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "certifi"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.120"]
dev = ["pytest>=8"]

[project.scripts]
orbit = "prbot.cli:main"
prbot = "prbot.cli:main"

[tool.setuptools.packages.find]
include = ["prbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff.lint]
select = ["F", "E9", "B"]
