[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "prbot"
version = "0.1.0"
description = "Repo-agnostic PR pre-review bot: cheap checks first, comments or auto-fixes issues so maintainers only see clean PRs."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "certifi"]

[project.optional-dependencies]
anthropic = ["anthropic>=0.120"]
dev = ["pytest>=8"]

[project.scripts]
prbot = "prbot.cli:main"

[tool.setuptools.packages.find]
include = ["prbot*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
