name: prereview

on:
  workflow_run:
    workflows: [prereview-analyze, test]
    types: [completed]
  issue_comment:
    types: [created]
  workflow_call:
    secrets:
      ORBIT_USER_REVIEW_TOKEN:
        required: false
      ORBIT_PUSH_TOKEN:
        required: false
      ORBIT_APP_PRIVATE_KEY:
        required: false
      ORBIT_LLM_BASE_URL:
        required: false
      ORBIT_LLM_API_KEY:
        required: false
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to recheck (blank = catch up on open PRs)
        required: false
        type: string
      fresh_model:
        description: Request a fresh model review for the specified PR
        type: boolean
        default: false

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
       (github.event.workflow_run.path == '.github/workflows/prereview-analyze.yml' ||
        github.event.workflow_run.path == '.github/workflows/test.yml')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.issue.state == 'open' && github.event.comment.user.type != 'Bot' &&
       (startsWith(github.event.comment.body, '/bot ') ||
        startsWith(github.event.comment.body, format('/bot{0}', fromJSON('"\t"'))))) ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    concurrency:
      group: prbot-review-writes
      queue: max
    # CI completion still refreshes GitHub status when the Hermes runner is offline.
    runs-on: >-
      ${{ ((github.event_name != 'workflow_run' ||
        github.event.workflow_run.path == '.github/workflows/prereview-analyze.yml' ||
        (vars.ORBIT_REVIEW_IDENTITY || vars.PRBOT_REVIEW_IDENTITY) == 'user') &&
        (vars.ORBIT_REVIEW_RUNNER || vars.PRBOT_REVIEW_RUNNER)) || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Mask local runner paths
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          if [ -n "${HOME:-}" ]; then printf '::add-mask::%s\n' "$HOME"; fi
          model_key="${ORBIT_LLM_API_KEY:-${PRBOT_LLM_API_KEY:-}}"
          if [ -n "$model_key" ]; then printf '::add-mask::%s\n' "$model_key"; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create Orbit installation token
        if: (vars.ORBIT_REVIEW_IDENTITY || vars.PRBOT_REVIEW_IDENTITY) != 'user' && (vars.ORBIT_APP_ID || vars.PRBOT_APP_ID) != ''
        id: orbit-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.ORBIT_APP_ID || vars.PRBOT_APP_ID }}
          private-key: ${{ secrets.ORBIT_APP_PRIVATE_KEY || secrets.PRBOT_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
      - uses: ./
        with:
          github-token: ${{ steps.orbit-token.outputs.token || github.token }}
          review-identity: ${{ vars.ORBIT_REVIEW_IDENTITY || vars.PRBOT_REVIEW_IDENTITY }}
          user-review-token: ${{ (vars.ORBIT_REVIEW_IDENTITY || vars.PRBOT_REVIEW_IDENTITY) == 'user' && (secrets.ORBIT_USER_REVIEW_TOKEN || secrets.PRBOT_USER_REVIEW_TOKEN) || '' }}
          push-token: ${{ secrets.ORBIT_PUSH_TOKEN || secrets.PRBOT_PUSH_TOKEN }}
          bot-login: ${{ steps.orbit-token.outputs.app-slug && format('{0}[bot]', steps.orbit-token.outputs.app-slug) || '' }}
          setup-python: ${{ runner.environment != 'self-hosted' }}
          llm-base-url: ${{ secrets.ORBIT_LLM_BASE_URL || secrets.PRBOT_LLM_BASE_URL }}
          llm-api-key: ${{ secrets.ORBIT_LLM_API_KEY || secrets.PRBOT_LLM_API_KEY }}
