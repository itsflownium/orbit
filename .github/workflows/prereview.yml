name: prereview

on:
  workflow_run:
    workflows: [prereview-analyze, test]
    types: [completed]
  issue_comment:
    types: [created]
  schedule:
    - cron: '7/10 * * * *'
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number to recheck (blank = catch up on open PRs)
        required: false
        type: string
      fresh_model:
        description: Request a fresh model review for the specified PR
        type: boolean
        default: false

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  review:
    if: >-
      (github.event_name == 'workflow_run' && github.event.workflow_run.event == 'pull_request' &&
       (github.event.workflow_run.path == '.github/workflows/prereview-analyze.yml' ||
        github.event.workflow_run.path == '.github/workflows/test.yml')) ||
      (github.event_name == 'issue_comment' && github.event.issue.pull_request &&
       github.event.issue.state == 'open' && github.event.comment.user.type != 'Bot' &&
       (startsWith(github.event.comment.body, '/bot ') ||
        startsWith(github.event.comment.body, format('/bot{0}', fromJSON('"\t"'))))) ||
      github.event_name == 'schedule' ||
      (github.event_name == 'workflow_dispatch' && github.ref_name == github.event.repository.default_branch)
    concurrency:
      group: prbot-review-writes
      queue: max
    # CI completion still refreshes GitHub status when the Hermes runner is offline.
    runs-on: ${{ ((github.event_name != 'workflow_run' || github.event.workflow_run.path == '.github/workflows/prereview-analyze.yml') && vars.PRBOT_REVIEW_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Mask local runner paths
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          if [ -n "${HOME:-}" ]; then printf '::add-mask::%s\n' "$HOME"; fi
          if [ -n "${PRBOT_LLM_API_KEY:-}" ]; then printf '::add-mask::%s\n' "$PRBOT_LLM_API_KEY"; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Validate review identity
        shell: bash
        env:
          REVIEW_IDENTITY: ${{ vars.PRBOT_REVIEW_IDENTITY }}
          USER_REVIEW_TOKEN: ${{ vars.PRBOT_REVIEW_IDENTITY == 'user' && secrets.PRBOT_USER_REVIEW_TOKEN || '' }}
        run: |
          case "$REVIEW_IDENTITY" in
            ''|bot) ;;
            user)
              if [ -z "$USER_REVIEW_TOKEN" ]; then
                echo '::error::User review mode requires the PRBOT_USER_REVIEW_TOKEN secret.'
                exit 1
              fi
              ;;
            *)
              echo '::error::PRBOT_REVIEW_IDENTITY must be bot or user.'
              exit 1
              ;;
          esac
      - name: Create Orbit installation token
        if: vars.PRBOT_REVIEW_IDENTITY != 'user' && vars.PRBOT_APP_ID != ''
        id: orbit-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.PRBOT_APP_ID }}
          private-key: ${{ secrets.PRBOT_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
      - uses: ./
        with:
          github-token: ${{ (vars.PRBOT_REVIEW_IDENTITY == 'user' && secrets.PRBOT_USER_REVIEW_TOKEN) || steps.orbit-token.outputs.token || github.token }}
          checks-token: ${{ vars.PRBOT_REVIEW_IDENTITY == 'user' && github.token || '' }}
          bot-login: ${{ steps.orbit-token.outputs.app-slug && format('{0}[bot]', steps.orbit-token.outputs.app-slug) || '' }}
          setup-python: ${{ runner.environment != 'self-hosted' }}
          llm-base-url: ${{ secrets.PRBOT_LLM_BASE_URL }}
          llm-api-key: ${{ secrets.PRBOT_LLM_API_KEY }}
