name: prereview

on:
  workflow_run:
    workflows: [prereview-analyze, test]
    types: [completed]

permissions:
  actions: read
  checks: read
  contents: read
  issues: write
  pull-requests: write
  statuses: write

jobs:
  review:
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      (github.event.workflow_run.path == '.github/workflows/prereview-analyze.yml' ||
       github.event.workflow_run.path == '.github/workflows/test.yml')
    concurrency:
      group: prbot-review-writes
      queue: max
    # A local Hermes gateway can serve the analysis-triggered review. Test completion
    # events continue to refresh GitHub status even when that runner is offline.
    runs-on: ${{ (github.event.workflow_run.path == '.github/workflows/prereview-analyze.yml' && vars.PRBOT_REVIEW_RUNNER) || 'ubuntu-latest' }}
    timeout-minutes: 20
    steps:
      - name: Mask local runner paths
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          if [ -n "${HOME:-}" ]; then printf '::add-mask::%s\n' "$HOME"; fi
          if [ -n "${PRBOT_LLM_API_KEY:-}" ]; then printf '::add-mask::%s\n' "$PRBOT_LLM_API_KEY"; fi
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Create Orbit installation token
        if: vars.PRBOT_APP_ID != ''
        id: orbit-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3
        with:
          app-id: ${{ vars.PRBOT_APP_ID }}
          private-key: ${{ secrets.PRBOT_APP_PRIVATE_KEY }}
          permission-actions: read
          permission-checks: read
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write
          permission-statuses: write
      - uses: ./
        with:
          github-token: ${{ steps.orbit-token.outputs.token || github.token }}
          bot-login: ${{ steps.orbit-token.outputs.app-slug && format('{0}[bot]', steps.orbit-token.outputs.app-slug) || '' }}
          setup-python: ${{ runner.environment != 'self-hosted' }}
          llm-base-url: ${{ secrets.PRBOT_LLM_BASE_URL }}
          llm-api-key: ${{ secrets.PRBOT_LLM_API_KEY }}
