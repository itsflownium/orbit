name: prereview-catch-up

on:
  schedule:
    - cron: '9,19,29,39,49,59 * * * *'

jobs:
  catch-up:
    permissions:
      actions: read
      checks: read
      contents: read
      issues: write
      pull-requests: write
      statuses: write
    # Use the normal review writer and its queue, runner selection, and posting identity.
    uses: ./.github/workflows/prereview.yml
    secrets:
      ORBIT_USER_REVIEW_TOKEN: ${{ secrets.ORBIT_USER_REVIEW_TOKEN || secrets.PRBOT_USER_REVIEW_TOKEN }}
      ORBIT_PUSH_TOKEN: ${{ secrets.ORBIT_PUSH_TOKEN || secrets.PRBOT_PUSH_TOKEN }}
      ORBIT_APP_PRIVATE_KEY: ${{ secrets.ORBIT_APP_PRIVATE_KEY || secrets.PRBOT_APP_PRIVATE_KEY }}
      ORBIT_LLM_BASE_URL: ${{ secrets.ORBIT_LLM_BASE_URL || secrets.PRBOT_LLM_BASE_URL }}
      ORBIT_LLM_API_KEY: ${{ secrets.ORBIT_LLM_API_KEY || secrets.PRBOT_LLM_API_KEY }}
