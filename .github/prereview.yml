autofix:
  mode: comment

comments:
  tag_author: true

checks:
  ci:
    required: [test]
  llm_review:
    severity: blocking
    only_when_clean: false
    context_paths:
      - prbot/cli.py
      - prbot/config.py

llm:
  provider: hermes
  review_model: deepseek/deepseek-v4.1-flash

analysis:
  required: false
